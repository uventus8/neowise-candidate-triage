<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { min-height: 1.5em; }
    #status[data-state="manual"], #status[data-state="tooLong"], #status[data-state="error"], #status[data-state="invalid"] {
      padding: .5rem .75rem; border-left: .25rem solid #b45309; background: #fef3c7; color: #3b2a06;
    }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; padding: .5rem .75rem; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <main>
  <h1>Входящие заявки</h1>
  <form id="triage-form">
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-labelledby="result-heading">
    <h2 id="result-heading">Результат AI</h2>
    <p>Тема: <strong id="topic"></strong></p>
    <p>Черновик ответа (проверьте перед отправкой клиенту):</p>
    <p id="draft"></p>
  </section>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
